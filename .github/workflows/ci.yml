name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-frontend:
    name: Frontend Typecheck, Tests & Build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
      - name: Install dependencies
        run: npm ci || npm install
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Typecheck test harnesses
        run: npm run eval:typecheck
      # Nothing in the type system spans the Tauri IPC boundary, so a frontend
      # invoke() of an unregistered command only fails at runtime.
      - name: Tauri command parity
        run: npm run check:commands
      # These test files are TypeScript executed directly by node, which needs
      # Node 22.18+. On Node 20 every one of them fails to load.
      - name: Unit tests
        run: npm run eval:test
      - name: Request assembly dry run
        run: npm run eval:dry-run
      - name: Build Frontend
        run: npm run build

  check-hud:
    name: HUD Layout Probe (WebKit)
    timeout-minutes: 15
    # macOS, not ubuntu: `playwright install --with-deps` shells out to apt-get on
    # Linux and hung there for 15 minutes. macOS needs no system deps, and its
    # WebKit build is closer to the WKWebView the app actually ships inside.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
      - name: Install dependencies
        run: npm ci || npm install
      - name: Cache WebKit
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # WebKit, not Chromium: the app runs in WKWebView, and Chromium supports
      # CSS that WebKit does not, so a Chromium run passes on real layout bugs.
      - name: Install WebKit
        timeout-minutes: 6
        run: npx playwright install webkit
      # Redirecting the background server's output matters: a child that inherits
      # the step's stdout holds the pipe open and the step never finishes.
      - name: Start dev server
        run: |
          nohup npm run dev > vite-dev.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:1420/ >/dev/null && exit 0
            sleep 1
          done
          echo "dev server never came up"
          cat vite-dev.log
          exit 1
      - name: Probe HUD layout
        run: npm run hud:probe
      - name: Upload probe screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hud-screenshots
          path: |
            dev-harness/out/
            vite-dev.log
          if-no-files-found: warn

  check-rust:
    name: Rust Backend Check & Tests
    timeout-minutes: 25
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Cargo Check
        working-directory: ./src-tauri
        run: cargo check
      - name: Cargo Test
        working-directory: ./src-tauri
        run: cargo test
