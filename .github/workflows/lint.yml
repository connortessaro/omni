name: Code Quality & Linter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend-lint:
    name: TypeScript & Frontend Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci || npm install

      - name: TypeScript Check
        run: npx tsc --noEmit

  rust-lint:
    name: Rust Clippy & Formatting
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Format Check
        working-directory: ./src-tauri
        run: cargo fmt --all -- --check || true

      - name: Clippy Linter
        working-directory: ./src-tauri
        run: cargo clippy --all-targets -- -D warnings || cargo clippy
