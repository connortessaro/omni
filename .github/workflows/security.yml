name: Security Audit

on:
  schedule:
    - cron: "0 0 * * 1" # Runs weekly every Monday at 00:00 UTC
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # Gates for real. The `|| true` this replaces was load-bearing only while
      # the @ricky0123/vad-* chain pinned onnxruntime-web back and every finding
      # needed a semver-major bump. That chain is upgraded and `npm audit` now
      # reports zero, so a new high-severity advisory should fail the build
      # rather than scroll past in a log.
      - name: NPM Security Audit
        run: npm audit --audit-level=high

      - name: Rust Security Audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Not `manifest-path`: this action takes no such input, so it was
          # discarded and cargo-audit fell back to ./Cargo.lock, which does not
          # exist here. The lockfile is in src-tauri, so point the working
          # directory at it. Every run of this job since it was added had failed
          # with "Couldn't load ./Cargo.lock", which meant Rust advisories were
          # never actually checked, including on the Dependabot Cargo PRs.
          working-directory: src-tauri
          # Three advisories with no fix available to us. Listed rather than left
          # failing, because a job that is permanently red gates nothing and
          # teaches everyone to ignore it, which is how the broken path above
          # survived for months. Everything else, and anything new, still fails
          # the build. Revisit whenever these dependencies move.
          #
          #   RUSTSEC-2026-0194  quick-xml, quadratic run time on duplicate attrs
          #   RUSTSEC-2026-0195  quick-xml, unbounded namespace allocation
          #     Both want >=0.41.0 and arrive via `plist` (macOS bundling) and
          #     `xcb` (Linux X11). Neither parses untrusted input here.
          #   RUSTSEC-2023-0071  rsa, Marvin timing side channel
          #     No patched release exists at all. Arrives via `sqlx-mysql`, which
          #     `tauri-plugin-sql` pulls in although this app uses sqlite, so the
          #     affected code is never reached.
          ignore: RUSTSEC-2026-0194,RUSTSEC-2026-0195,RUSTSEC-2023-0071
