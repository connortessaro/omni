name: Security Audit

on:
  schedule:
    - cron: "0 0 * * 1" # Runs weekly every Monday at 00:00 UTC
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # Reports without gating, on purpose: the current findings all need
      # semver-major bumps (vite, and the @ricky0123/vad-* chain that carries
      # onnxruntime-web), so removing `|| true` today would fail every PR on
      # advisories nobody can fix in that PR. Drop the `|| true` once those are
      # upgraded, so this actually blocks.
      - name: NPM Security Audit
        run: npm audit --audit-level=high || true

      - name: Rust Security Audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Not `manifest-path`: this action takes no such input, so it was
          # discarded and cargo-audit fell back to ./Cargo.lock, which does not
          # exist here. The lockfile is in src-tauri, so point the working
          # directory at it. Every run of this job since it was added had failed
          # with "Couldn't load ./Cargo.lock", which meant Rust advisories were
          # never actually checked, including on the Dependabot Cargo PRs.
          working-directory: src-tauri
