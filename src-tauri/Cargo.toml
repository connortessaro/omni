[package]
name = "omni"
version = "0.1.9"
description = "Local-first AI assistant for the desktop. Bring your own provider key."
authors = ["Connor Tessaro"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "omni_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.9.0"
tauri-plugin-http = "2.5.2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25.6"
xcap = "0.0.12"
base64 = "0.22"
cpal = "0.15.3"
hound = "3.5.1"
tokio = { version = "1.0", features = ["full"] }
once_cell = "1.19.0"
keyring = "4"
regex = "1"
url = "2"
uuid = { version = "1.0", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
futures-util = "0.3"
anyhow = "1.0"
tracing = "0.1"
ringbuf = "0.4.8"
tauri-plugin-shell = "2.3.1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-macos-permissions = "2"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }
# System-audio capture via ScreenCaptureKit. These are objc2 framework bindings:
# they link the frameworks declaratively and compile no Objective-C, so unlike
# `cidre` they build with Command Line Tools and need no full Xcode install.
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-screen-capture-kit = { version = "0.3.2", features = [
    "SCStream",
    "SCShareableContent",
    "block2",
    "dispatch2",
    "objc2-core-media",
] }
objc2-core-media = { version = "0.3.2", features = [
    "CMSampleBuffer",
    "CMBlockBuffer",
    "CMFormatDescription",
    "objc2-core-audio-types",
] }
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
block2 = "0.6.2"
dispatch2 = "0.3.1"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.19.0"

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30.1"
libpulse-simple-binding = "2.29.0"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
